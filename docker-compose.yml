version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    networks:
      - app-network

  kiss-you:
    build:
      context: .
    container_name: nestjs-app
    ports:
      - '3000:3000'
    depends_on:
      - mongodb
    environment:
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URI: ${MONGO_URI}
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
